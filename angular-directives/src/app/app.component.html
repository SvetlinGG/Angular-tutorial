<h1>Welcome to Angular directives</h1>

<h2 *ngIf="isLoggedIn" >{{userName}}</h2>

@if (isLoggedIn) {
  <h2>{{secondUserName}}</h2>
}

<ul>
  @for (user of users; track $index) {
    @if (user.age > 30) {
      <li>{{user.firstName}} {{user.firstName}} {{user.age}}</li>
    }
    
  }
</ul>


<router-outlet />
